name: AI Code Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          
      - run: npm ci
      - run: npm run review:install
      
      - name: Run review
        id: review
        run: |
          set +e
          npm run review > review-output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e
          sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g; s/\x1B\]8;;[^\x1B]*\x1B\\//g; s/\x1B\]8;;\x1B\\//g' review-output.txt > review-clean.txt || echo "No output" > review-clean.txt
          exit 0
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_BASE: origin/main
          REVIEW_HEAD: ${{ github.sha }}
      
      - name: Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.existsSync('review-clean.txt') ? fs.readFileSync('review-clean.txt', 'utf8') : 'No output';
            const exitCode = '${{ steps.review.outputs.exit_code }}';
            const marker = '<!-- ai-review -->';
            
            // Parse issues from review output
            const blockerCount = (content.match(/🔴 BLOCKER/g) || []).length;
            const majorCount = (content.match(/🟡 MAJOR/g) || []).length;
            const minorCount = (content.match(/🟢 MINOR/g) || []).length;
            const nitCount = (content.match(/⚪ NIT/g) || []).length;
            
            const totalIssues = blockerCount + majorCount + minorCount + nitCount;
            const hasBlockers = blockerCount > 0;
            const hasMajor = majorCount > 0;
            
            // Determine status
            let statusEmoji = '✅';
            let statusText = 'Review passed';
            
            if (exitCode !== '0') {
              statusEmoji = '❌';
              statusText = 'Review failed';
            } else if (hasBlockers) {
              statusEmoji = '🔴';
              statusText = 'Blockers found';
            } else if (hasMajor) {
              statusEmoji = '🟡';
              statusText = 'Major issues found';
            } else if (totalIssues > 0) {
              statusEmoji = '✅';
              statusText = 'Review passed with suggestions';
            } else {
              statusEmoji = '✅';
              statusText = 'No issues found';
            }
            
            // Build issues summary
            const issueParts = [];
            if (blockerCount > 0) issueParts.push(`${blockerCount} blocker${blockerCount > 1 ? 's' : ''}`);
            if (majorCount > 0) issueParts.push(`${majorCount} major`);
            if (minorCount > 0) issueParts.push(`${minorCount} minor`);
            if (nitCount > 0) issueParts.push(`${nitCount} nit${nitCount > 1 ? 's' : ''}`);
            
            const issuesSummary = totalIssues === 0 
              ? 'No issues found' 
              : issueParts.join(', ');
            
            const body = `${marker}
## 🤖 AI Review ${statusEmoji}

**Status:** ${statusText}
**Issues found:** ${issuesSummary}

<details>
<summary>View detailed findings</summary>

${content}

</details>

---
<sub>Powered by [Cursor SDK](https://cursor.com/docs/sdk/typescript)</sub>`;
            
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existing = comments.find(c => c.body?.includes(marker));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
