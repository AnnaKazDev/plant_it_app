name: 🤖 AI Code Review

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Run on PR open/update OR when ai-cr:review label added
    if: |
      github.event.action != 'labeled' || 
      github.event.label.name == 'ai-cr:review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          
      - run: npm ci
      
      - name: Run AI Review
        id: review
        uses: ./.github/actions/ai-review
        with:
          api-key: ${{ secrets.CURSOR_API_KEY }}
          base-ref: origin/main
          head-ref: ${{ github.sha }}
      
      - name: Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.review.outputs.exit-code }}';
            const marker = '<!-- ai-review -->';
            
            let review = null;
            let content = '';
            let statusText = 'Review failed';
            let emoji = '❌';
            
            // Check exit code first - non-zero means failure regardless of JSON
            if (exitCode !== '0') {
              console.log('Review failed with exit code:', exitCode);
              statusText = 'Review failed';
              emoji = '❌';
              
              // Try to read any error output
              if (fs.existsSync('review-clean.txt')) {
                content = fs.readFileSync('review-clean.txt', 'utf8');
              } else {
                content = 'Review agent failed with exit code ' + exitCode;
              }
            } else if (fs.existsSync('review-output.json')) {
              // Exit code 0 and JSON exists - parse and validate
              try {
                const jsonContent = fs.readFileSync('review-output.json', 'utf8');
                review = JSON.parse(jsonContent);
                
                // Basic schema validation (inline)
                if (!review.overall_verdict || !review.summary || !Array.isArray(review.criteria)) {
                  throw new Error('Invalid review JSON structure');
                }
                
                if (review.criteria.length !== 10) {
                  throw new Error('Expected exactly 10 criteria, got ' + review.criteria.length);
                }
                
                // Count findings by severity
                let blockerCount = 0, majorCount = 0, minorCount = 0, nitCount = 0;
                for (const criterion of review.criteria) {
                  if (!Array.isArray(criterion.findings)) {
                    throw new Error('Criterion missing findings array: ' + criterion.name);
                  }
                  for (const finding of criterion.findings) {
                    if (finding.severity === 'BLOCKER') blockerCount++;
                    else if (finding.severity === 'MAJOR') majorCount++;
                    else if (finding.severity === 'MINOR') minorCount++;
                    else if (finding.severity === 'NIT') nitCount++;
                  }
                }
                
                const totalIssues = blockerCount + majorCount + minorCount + nitCount;
                emoji = review.overall_verdict === 'PASS' ? '✅' : '🔴';
                
                if (totalIssues === 0) {
                  statusText = 'No issues found';
                } else {
                  const parts = [];
                  if (blockerCount > 0) parts.push('🔴 ' + blockerCount + ' blocker' + (blockerCount > 1 ? 's' : ''));
                  if (majorCount > 0) parts.push('🟡 ' + majorCount + ' major');
                  if (minorCount > 0) parts.push('🟢 ' + minorCount + ' minor');
                  if (nitCount > 0) parts.push('⚪ ' + nitCount + ' nit' + (nitCount > 1 ? 's' : ''));
                  statusText = `${review.overall_verdict} | ${parts.join(', ')}`;
                }
                
                // Read markdown output
                content = fs.existsSync('review-clean.txt') ? fs.readFileSync('review-clean.txt', 'utf8') : review.summary;
              } catch (err) {
                console.error('Failed to parse or validate review JSON:', err);
                emoji = '❌';
                statusText = 'JSON parse/validation failed';
                content = fs.existsSync('review-clean.txt') ? fs.readFileSync('review-clean.txt', 'utf8') : 'Parse error: ' + err.message;
              }
            } else {
              // Exit code 0 but no JSON - unexpected
              statusText = 'No structured output generated';
              content = fs.existsSync('review-clean.txt') ? fs.readFileSync('review-clean.txt', 'utf8') : 'Review completed but produced no output';
            }
            
            const body = marker + '\n## 🤖 AI Review ' + emoji + '\n\n**Status:** ' + statusText + '\n\n<details>\n<summary>View detailed findings</summary>\n\n' + content + '\n\n</details>\n\n---\n<sub>Powered by [Cursor SDK](https://cursor.com/docs/sdk/typescript)</sub>';
            
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existing = comments.find(c => c.body && c.body.includes(marker));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
      
      - name: Remove retry label
        if: github.event.action == 'labeled' && github.event.label.name == 'ai-cr:review' && steps.review.outputs.exit-code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'ai-cr:review'
              });
            } catch (e) {
              // Ignore 404 if label already removed
              if (e.status !== 404) throw e;
            }
