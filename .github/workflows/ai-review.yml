name: 🤖 AI Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-code-review:
    # Run on PR open/update OR when ai-cr:review label added
    if: |
      github.event.action != 'labeled' || 
      github.event.label.name == 'ai-cr:review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          
      - run: npm ci
      
      - name: Run AI Review
        id: review
        uses: ./.github/actions/ai-review
        with:
          api-key: ${{ secrets.CURSOR_API_KEY }}
          base-ref: origin/main
          head-ref: ${{ github.sha }}
      
      - name: Format PR comment
        if: always()
        run: |
          npm run format-pr-comment --prefix packages/code-review-agent -- \
            --cwd "${{ github.workspace }}" \
            --exit-code "${{ steps.review.outputs.exit-code }}" \
            --validation-exit-code "${{ steps.review.outputs.validation-exit-code }}" \
            --json-path review-output.json \
            --clean-txt-path review-clean.txt \
            --output pr-comment.json
      
      - name: Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-review -->';
            let statusText = 'Review failed';
            let emoji = '❌';
            let content = 'Could not format review output.';

            try {
              const formatted = JSON.parse(fs.readFileSync('pr-comment.json', 'utf8'));
              statusText = formatted.statusText;
              emoji = formatted.emoji;
              content = formatted.content;
            } catch (err) {
              console.error('Failed to read pr-comment.json:', err);
              if (fs.existsSync('review-clean.txt')) {
                content = fs.readFileSync('review-clean.txt', 'utf8');
              }
            }

            const body = marker + '\n## 🤖 AI Review ' + emoji + '\n\n**Status:** ' + statusText + '\n\n<details>\n<summary>View detailed findings</summary>\n\n' + content + '\n\n</details>\n\n---\n<sub>Powered by [Cursor SDK](https://cursor.com/docs/sdk/typescript)</sub>';
            
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existing = comments.find(c => c.body && c.body.includes(marker));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
      
      - name: Remove retry label
        if: always() && github.event.action == 'labeled' && github.event.label.name == 'ai-cr:review'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'ai-cr:review'
              });
            } catch (e) {
              // Ignore 404 if label already removed
              if (e.status !== 404) throw e;
            }
