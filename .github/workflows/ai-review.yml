name: Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so agent can compute diffs
          fetch-depth: 0
          # Checkout PR head (not merge ref) to ensure agent sees actual PR content
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install review agent
        run: npm run review:install

      - name: Run code review
        run: npm run review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_BASE: origin/main
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
