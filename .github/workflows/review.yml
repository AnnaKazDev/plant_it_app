name: AI Code Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Base ref to compare against'
        required: false
        default: 'origin/main'
      head:
        description: 'Head ref to review'
        required: false
        default: 'HEAD'

# Required for posting PR comments
permissions:
  contents: read
  pull-requests: write

# Prevent duplicate reviews on concurrent pushes to the same PR
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip fork PRs (no secrets available)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so agent can compute diffs
          fetch-depth: 0
          # Checkout PR head (not merge ref) to ensure agent sees actual PR content
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install review agent
        run: npm run review:install

      - name: Run code review
        id: review
        run: |
          # Capture exit code before masking failure
          set +e
          npm run review > review-output.txt
          exit_code=$?
          set -e
          
          echo "exit_code=${exit_code}" >> $GITHUB_OUTPUT
          
          # Remove ANSI color codes for GitHub comment
          if [ -f review-output.txt ]; then
            # Remove ANSI escape sequences (colors, OSC 8 hyperlinks)
            sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g; s/\x1B\]8;;[^\x1B]*\x1B\\//g; s/\x1B\]8;;\x1B\\//g' review-output.txt > review-clean.txt
            
            # Truncate if too large (GitHub comment limit ~65k chars)
            if [ $(wc -c < review-clean.txt) -gt 60000 ]; then
              head -c 60000 review-clean.txt > review-truncated.txt
              echo -e "\n\n... (output truncated, see workflow logs for full review)" >> review-truncated.txt
              mv review-truncated.txt review-clean.txt
            fi
          else
            echo "Review output file not found" > review-clean.txt
          fi
          
          # Continue workflow even on failure so comment step runs
          exit 0
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # For PRs: compare PR head against target branch
          REVIEW_BASE: ${{ github.event.pull_request.base.ref || github.event.inputs.base || 'origin/main' }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.event.inputs.head || 'HEAD' }}
          # Optional: override model (default: composer-2.5)
          # CURSOR_MODEL: composer-2.5

      - name: Comment review on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let reviewContent = 'Review completed. Check workflow logs for details.';
            
            try {
              if (fs.existsSync('review-clean.txt')) {
                reviewContent = fs.readFileSync('review-clean.txt', 'utf8');
              }
            } catch (error) {
              console.error('Failed to read review output:', error);
            }
            
            const exitCode = '${{ steps.review.outputs.exit_code }}';
            const statusEmoji = exitCode === '0' ? '✅' : exitCode === '3' ? '⚠️' : '❌';
            const statusText = exitCode === '0' ? 'Review completed' : 
                              exitCode === '3' ? 'Review completed (working tree modified)' : 
                              'Review failed';
            
            const marker = '<!-- plant-it-ai-review -->';
            
            const body = `${marker}
## 🤖 AI Code Review ${statusEmoji}

**Status:** ${statusText}
**Exit code:** ${exitCode}

<details>
<summary>Review findings</summary>

${reviewContent}

</details>

---
<sub>Powered by [Cursor SDK](https://cursor.com/docs/sdk/typescript) • Model: composer-2.5</sub>`;
            
            // Find existing review comment to update instead of creating duplicate
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });
            
            const existingComment = comments.data.find(c => c.body?.includes(marker));
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
              console.log('Updated existing review comment');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
              console.log('Created new review comment');
            }
