name: ✅ Lint · Build · Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      # Cache and install code-review-agent package
      - name: Cache code-review-agent node_modules
        uses: actions/cache@v4
        with:
          path: packages/code-review-agent/node_modules
          key: review-agent-${{ runner.os }}-${{ hashFiles('packages/code-review-agent/package-lock.json') }}
          restore-keys: |
            review-agent-${{ runner.os }}-
      
      - name: Install, typecheck, and test code-review-agent
        run: |
          npm run review:install
          npm run typecheck --prefix packages/code-review-agent
          npm run test --prefix packages/code-review-agent

      # Auto-deploy to Cloudflare Workers on push to main
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
