name: AI Code Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          
      - run: npm ci
      - run: npm run review:install
      
      - name: Run review
        id: review
        run: |
          set +e
          npm run review > review-output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e
          sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g; s/\x1B\]8;;[^\x1B]*\x1B\\//g; s/\x1B\]8;;\x1B\\//g' review-output.txt > review-clean.txt || echo "No output" > review-clean.txt
          exit 0
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_BASE: origin/main
          REVIEW_HEAD: ${{ github.sha }}
      
      - name: Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.existsSync('review-clean.txt') ? fs.readFileSync('review-clean.txt', 'utf8') : 'No output';
            const exitCode = '${{ steps.review.outputs.exit_code }}';
            const emoji = exitCode === '0' ? '✅' : '❌';
            const marker = '<!-- ai-review -->';
            
            const body = `${marker}\n## 🤖 AI Review ${emoji}\n\n**Exit:** ${exitCode}\n\n<details>\n<summary>Details</summary>\n\n${content}\n\n</details>`;
            
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existing = comments.find(c => c.body?.includes(marker));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
